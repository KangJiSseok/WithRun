services:
  valhalla:
    image: ${VALHALLA_IMAGE:-ghcr.io/valhalla/valhalla-scripted:latest}
    container_name: withrun-valhalla-local
    ports:
      - "${VALHALLA_PORT:-8002}:8002"
    volumes:
      - ./custom_files:/custom_files
    environment:
      tile_urls: ${VALHALLA_TILE_URL}
      use_tiles_ignore_pbf: ${VALHALLA_USE_TILES_IGNORE_PBF:-False}
      force_rebuild: ${VALHALLA_FORCE_REBUILD:-False}
      build_tar: ${VALHALLA_BUILD_TAR:-False}
      server_threads: ${VALHALLA_SERVER_THREADS:-1}
      use_default_speeds_config: ${VALHALLA_USE_DEFAULT_SPEEDS_CONFIG:-False}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:8002/status >/dev/null 2>&1 || wget -qO- http://localhost:8002/status >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
