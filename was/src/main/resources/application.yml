spring:
  config:
    import: 'aws-parameterstore:/config/withrun/'
  datasource:
    url: ${jdbc.url}
    username: ${jdbc.username}
    password: ${jdbc.password}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

cloud:
  aws:
    region:
      static: ap-northeast-2

app:
  s3:
    bucket: ${s3.bucket:}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
