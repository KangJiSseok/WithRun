plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.mobile.watch'
    compileSdk 35

    signingConfigs {
        debug {
            // 폰 앱(Expo)과 동일한 키스토어 사용 → Wearable Data Layer 인증서 일치 필수 조건
            storeFile file('../../mobile/android/app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        // 폰 앱(com.mobile)과 동일한 applicationId → Wearable Data Layer 통신 필수 조건
        applicationId "com.mobile"
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }
}

dependencies {
    // Wearable Data Layer (폰-워치 통신 핵심)
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'

    // Health Services (실시간 센서 데이터 수집 - 정식 안정화 버전)
    implementation 'androidx.health:health-services-client:1.0.0'
    // ListenableFuture를 코루틴으로 편하게 쓰기 위함
    implementation 'androidx.concurrent:concurrent-futures-ktx:1.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'

    // Compose BOM
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Wear OS Compose
    implementation 'androidx.wear.compose:compose-material:1.4.0'
    implementation 'androidx.wear.compose:compose-foundation:1.4.0'

    // Activity Compose
    implementation 'androidx.activity:activity-compose:1.9.3'

    // Wear OS Ambient Mode (AOD)
    implementation 'androidx.wear:wear:1.3.0'

    // Coroutines (Tasks.await 및 ListenableFuture.await 사용)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.8.1'
}
