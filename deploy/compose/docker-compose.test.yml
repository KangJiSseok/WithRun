services:
  was:
    image: ${DOCKERHUB_USERNAME}/withrun-was:dev-latest
    container_name: withrun-was-test
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: test
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    restart: unless-stopped
  
  web:
    image: ${DOCKERHUB_USERNAME}/withrun-web:dev-latest
    container_name: withrun-web-test
    ports:
      - "81:80"
    restart: unless-stopped