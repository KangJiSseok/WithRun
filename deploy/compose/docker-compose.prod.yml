services:
  was:
    image: ${DOCKERHUB_USERNAME}/withrun-was:prod-latest
    container_name: withrun-was-prod
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    restart: unless-stopped

  web:
    image: ${DOCKERHUB_USERNAME}/withrun-web:dev-latest
    container_name: withrun-web-test
    ports:
      - "80:80"
    restart: unless-stopped