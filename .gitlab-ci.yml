stages:
  - build
  - test
  - image
  - deploy

default:
  tags:
    - prod

variables:
  WAS_DIR: "was"
  TEST_DEPLOY_DIR: "/home/ubuntu/test-app"
  PROD_DEPLOY_DIR: "/home/ubuntu/prod-app"
  WAS_IMAGE: "$DOCKERHUB_USERNAME/withrun-was"
  WEB_IMAGE: "$DOCKERHUB_USERNAME/withrun-web"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" &&
      $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "feat-infra/cicd-pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - when: never

build_was:
  stage: build
  script:
    - cd was
    - chmod +x gradlew
    - ./gradlew clean build -x test
  artifacts:
    paths:
      - was/build/
    expire_in: 1 day

test_was:
  stage: test
  script:
    - cd was
    - chmod +x gradlew
    - ./gradlew test

docker_push_dev:
  stage: image
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "feat-infra/cicd-pipeline"'
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker build -t "$WAS_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$WAS_IMAGE:dev-latest" ./was
    - docker build -t "$WEB_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$WEB_IMAGE:dev-latest" ./web
    - docker push "$WAS_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$WAS_IMAGE:dev-latest"
    - docker push "$WEB_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$WEB_IMAGE:dev-latest"

docker_push_prod:
  stage: image
  rules:
    - when: never
  script:
    - echo "skip prod image push"

deploy_test:
  stage: deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "feat-infra/cicd-pipeline"'
  environment:
    name: test
  script:
    - cp deploy/compose/docker-compose.test.yml "$TEST_DEPLOY_DIR/"
    - cd "$TEST_DEPLOY_DIR"
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker compose -f docker-compose.test.yml pull
    - docker compose -f docker-compose.test.yml down --remove-orphans
    - docker compose -f docker-compose.test.yml up -d

deploy_prod:
  stage: deploy
  rules:
    - when: never
  environment:
    name: production
  script:
    - echo "skip prod deploy"